<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | Telugu GFA</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#111;
font-family:Arial,sans-serif;
margin:0;
color:#fff;
}

header{
background:#000;
padding:20px;
text-align:center;
}

header h1{
color:#FFD700;
margin:0;
}

nav{
margin-top:15px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#FFD700;
}

.title{
text-align:center;
margin:40px 0;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
gap:30px;
padding:30px;
}

.card{
background:#1a1a1a;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 0 25px rgba(255,215,0,.25);
}

.slider{
position:relative;
width:100%;
height:300px;
overflow:hidden;
background:#fff;
border-radius:15px;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
transition:.8s;
}

.slide.active{
opacity:1;
}

.card h2{
color:#FFD700;
}

.price{
font-size:34px;
font-weight:bold;
margin:10px;
}

.desc{
color:#ddd;
margin-bottom:20px;
}

button{
background:#FFD700;
border:none;
padding:14px 30px;
font-size:18px;
border-radius:40px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:orange;
}

.whatsapp{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1>Telugu GFA Cricket Store</h1>

<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<div class="title">

<h1>Premium Cricket Bats</h1>

<p>High Quality • Best Scoop • Best Performance</p>

</div>

<div class="products">

<!-- PRODUCT 1 -->

<div class="card">

<div class="slider">

<img src="bat 1.jpeg" class="slide active">

<img src="bat 2.jpeg" class="slide">

<img src="bat 3.jpeg" class="slide">

</div>

<h2>Diamond Scoop (Single Blade)</h2>

<div class="price">₹2200</div>

<div class="desc">

Best Scoop and Best Performance

</div>

<button onclick="window.location='cart.html'">

Add To Cart

</button>

<br><br>

<a class="whatsapp"

href="https://wa.me/916300814612?text=I%20want%20to%20order%20Diamond%20Scoop%20(Single%20Blade)%20₹2200">

Order on WhatsApp

</a>

</div>

<!-- PRODUCT 2 -->

<div class="card">

<div class="slider">

<img src="bat 4.jpeg" class="slide active">

<img src="bat 5.jpeg" class="slide">

<img src="bat 6.jpeg" class="slide">

</div>

<h2>Kerala Scoop (Double Blade)</h2>

<div class="price">₹2400</div>

<div class="desc">

Best Scoop and Best Performance

</div>

<button onclick="window.location='cart.html'">

Add To Cart

</button>

<br><br>

<a class="whatsapp"

href="https://wa.me/916300814612?text=I%20want%20to%20order%20Kerala%20Scoop%20(Double%20Blade)%20₹2400">

Order on WhatsApp

</a>

</div>

</div>

<script>

const sliders=document.querySelectorAll(".slider");

sliders.forEach(slider=>{

const slides=slider.querySelectorAll(".slide");

let index=0;

setInterval(()=>{

slides[index].classList.remove("active");

index=(index+1)%slides.length;

slides[index].classList.add("active");

},2500);

});

</script>

</body>
</html>
